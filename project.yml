name: MissionZebra
options:
  bundleIdPrefix: com.missionzebra
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    version: "11.0.0"
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    version: "7.0.0"

targets:
  MissionZebra:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: MissionZebra
        excludes:
          - "**/.DS_Store"
      - path: MissionZebraShared
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: be.missionzebra.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "3"
        INFOPLIST_FILE: MissionZebra/Info.plist
        SWIFT_VERSION: "5.9"
        DEVELOPMENT_TEAM: "MK69VX9ZR4"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: MissionZebra/MissionZebra.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: "NO"
      configs:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production
    dependencies:
      - target: MissionZebraDeviceActivityMonitor
        embed: true
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseMessaging
      - package: Firebase
        product: FirebaseFunctions
      - package: GoogleSignIn
    postCompileScripts: []

  MissionZebraDeviceActivityMonitor:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: MissionZebraDeviceActivityMonitor
        excludes:
          - "**/.DS_Store"
      - path: MissionZebraShared
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: be.missionzebra.app.deviceactivity
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "3"
        INFOPLIST_FILE: MissionZebraDeviceActivityMonitor/Info.plist
        SWIFT_VERSION: "5.9"
        DEVELOPMENT_TEAM: "MK69VX9ZR4"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: MissionZebraDeviceActivityMonitor/MissionZebraDeviceActivityMonitor.entitlements
        SKIP_INSTALL: "YES"

  MissionZebraTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: MissionZebraTests
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: be.missionzebra.app.tests
        SWIFT_VERSION: "5.9"
        DEVELOPMENT_TEAM: "MK69VX9ZR4"
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MissionZebra.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/MissionZebra"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: MissionZebra

schemes:
  MissionZebra:
    build:
      targets:
        MissionZebra: all
    run:
      config: Debug
      storeKitConfiguration: MissionZebra/MissionZebra.storekit
    test:
      config: Debug
      targets:
        - MissionZebraTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
